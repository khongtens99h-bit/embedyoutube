<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool tạo mã nhúng YouTube</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #111827;
    }

    .container {
      max-width: 1050px;
      margin: 40px auto;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    p {
      color: #6b7280;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      outline: none;
      resize: vertical;
      background: #f9fafb;
    }

    textarea:focus {
      border-color: #2563eb;
      background: #fff;
    }

    #inputLinks {
      min-height: 180px;
    }

    .generate-btn {
      margin-top: 16px;
      background: #111827;
      color: #fff;
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .result-list {
      margin-top: 28px;
      display: grid;
      gap: 18px;
    }

    .result-item {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }

    .result-item.copied-item {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .video-link {
      font-size: 14px;
      color: #4b5563;
      word-break: break-all;
      flex: 1;
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .copy-btn {
      background: #2563eb;
      color: #fff;
    }

    .copy-btn.copied {
      background: #16a34a;
    }

    .toggle-btn {
      background: #e5e7eb;
      color: #111827;
      display: none;
    }

    .toggle-btn.show {
      display: inline-block;
    }

    .embed-box {
      min-height: 220px;
      font-family: Consolas, monospace;
      font-size: 14px;
    }

    .embed-box.hidden {
      display: none;
    }

    .copied-label {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 14px;
    }

    .copied-label.show {
      display: block;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <h1>Tool tạo mã nhúng YouTube</h1>
      <p>Dán nhiều link YouTube, mỗi link một dòng. Tool sẽ tạo từng mã embed riêng và có nút copy.</p>

      <textarea id="inputLinks" placeholder="https://www.youtube.com/watch?v=xxxxx
https://youtu.be/xxxxx
https://www.youtube.com/embed/xxxxx"></textarea>

      <button class="generate-btn" onclick="generateEmbedCodes()">Tạo code embed</button>

      <div id="resultList" class="result-list"></div>
    </div>
  </div>

  <script>
    function extractVideoId(link) {
      link = link.trim();

      try {
        const url = new URL(link);

        if (url.hostname.includes("youtube.com")) {
          if (url.pathname === "/watch") {
            return url.searchParams.get("v");
          }

          if (url.pathname.includes("/embed/")) {
            return url.pathname.split("/embed/")[1].split("?")[0];
          }

          if (url.pathname.includes("/shorts/")) {
            return url.pathname.split("/shorts/")[1].split("?")[0];
          }
        }

        if (url.hostname.includes("youtu.be")) {
          return url.pathname.replace("/", "").split("?")[0];
        }

      } catch (e) {
        return null;
      }

      return null;
    }

    function createEmbedCode(videoId) {
      return `<div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden;">
  <iframe
    src="https://www.youtube.com/embed/${videoId}"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
  </iframe>
</div>`;
    }

    function copyCode(button, text, textarea, item, copiedLabel, toggleBtn) {
      navigator.clipboard.writeText(text);

      button.innerText = "Đã copy";
      button.classList.add("copied");
      button.style.display = "none";

      textarea.classList.add("hidden");
      copiedLabel.classList.add("show");

      toggleBtn.classList.add("show");
      toggleBtn.innerText = "Mở lại";

      item.classList.add("copied-item");
    }

    function toggleTextarea(textarea, toggleBtn, copyBtn) {
      const isHidden = textarea.classList.contains("hidden");

      if (isHidden) {
        textarea.classList.remove("hidden");
        toggleBtn.innerText = "Thu gọn";
        copyBtn.style.display = "inline-block";
      } else {
        textarea.classList.add("hidden");
        toggleBtn.innerText = "Mở lại";
        copyBtn.style.display = "none";
      }
    }

    function generateEmbedCodes() {
      const input = document.getElementById("inputLinks").value;

      const lines = input
        .split("\n")
        .map(line => line.trim())
        .filter(line => line !== "");

      const resultList = document.getElementById("resultList");
      resultList.innerHTML = "";

      lines.forEach((link, index) => {
        const videoId = extractVideoId(link);

        const item = document.createElement("div");
        item.className = "result-item";

        if (!videoId) {
          item.innerHTML = `
            <div class="error">Link không hợp lệ: ${link}</div>
          `;
          resultList.appendChild(item);
          return;
        }

        const embedCode = createEmbedCode(videoId);

        item.innerHTML = `
          <div class="result-top">
            <div class="video-link">Video ${index + 1}: ${link}</div>

            <div class="button-group">
              <button class="copy-btn">Copy code</button>
              <button class="toggle-btn">Mở lại</button>
            </div>
          </div>

          <textarea class="embed-box" readonly>${embedCode}</textarea>

          <div class="copied-label">Đã copy code embed</div>
        `;

        const copyBtn = item.querySelector(".copy-btn");
        const toggleBtn = item.querySelector(".toggle-btn");
        const textarea = item.querySelector(".embed-box");
        const copiedLabel = item.querySelector(".copied-label");

        copyBtn.addEventListener("click", function () {
          copyCode(copyBtn, embedCode, textarea, item, copiedLabel, toggleBtn);
        });

        toggleBtn.addEventListener("click", function () {
          toggleTextarea(textarea, toggleBtn, copyBtn);
        });

        resultList.appendChild(item);
      });
    }
  </script>

</body>
</html>
